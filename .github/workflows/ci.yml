name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `next lint` was removed in Next.js 16 and the repo has no ESLint
      # flat config yet — re-enable once migrated to `eslint .` or biome.
      - run: npx tsc --noEmit
      - run: npm test
